<header>
  <div class="nav-inner">
    <div class="nav-logo">
      <a href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="Context & Cringe" />
      </a>
    </div>
    <nav>
      {% for item in site.data.nav %}
        {% if item.match_exact %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.title }}</a>
        {% else %}
          <a href="{{ item.url | relative_url }}" {% if page.url contains item.match %}class="active"{% endif %}>{{ item.title }}</a>
        {% endif %}
      {% endfor %}
      <a href="{{ site.buy_url }}" class="nav-cta" target="_blank" rel="noopener">Buy the Game</a>
    </nav>
  </div>
</header>
